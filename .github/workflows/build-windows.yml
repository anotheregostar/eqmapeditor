name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm eq_map_editor.spec

      - name: Create full release folder
        shell: pwsh
        run: |
          if (Test-Path "release") { Remove-Item "release" -Recurse -Force }
          if (Test-Path "EQMapEditor-Windows.zip") { Remove-Item "EQMapEditor-Windows.zip" -Force }

          New-Item -ItemType Directory -Path "release" | Out-Null

          # Put the built app in its own folder.
          Copy-Item "dist\EQMapEditor" "release\EQMapEditor" -Recurse -Force

          # Include the NPC data/tools folder, including the provided Combined Map Data workbook.
          if (Test-Path "NPC Data") {
            robocopy "NPC Data" "release\NPC Data" /E /XF "*Expansion Apply Summary.csv" /XD "*map backup before expansion apply*"
            if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }
            $global:LASTEXITCODE = 0
          }

          # Include documentation and project files if present.
          if (Test-Path "docs") { Copy-Item "docs" "release\docs" -Recurse -Force }
          if (Test-Path "README.md") { Copy-Item "README.md" "release\README.md" -Force }
          if (Test-Path "CHANGELOG.md") { Copy-Item "CHANGELOG.md" "release\CHANGELOG.md" -Force }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "release\LICENSE" -Force }
          if (Test-Path "requirements.txt") { Copy-Item "requirements.txt" "release\requirements.txt" -Force }

      - name: Show release contents
        shell: pwsh
        run: |
          Get-ChildItem "release" -Recurse | Select-Object FullName

      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "release\*" -DestinationPath "EQMapEditor-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EQMapEditor-Windows
          path: EQMapEditor-Windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EQMapEditor-Windows.zip
